<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'" />
    <title>VYRSE quick ask</title>
    <style>
      @font-face { font-family: "Space Grotesk"; font-weight: 400; src: url("fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }

      /* VYRSE palette (same tokens as the app) and its liquid-glass material. A floating window can't blur
         the desktop behind it, so the fill is denser than in the app; rim, highlight and depth match. */
      :root {
        --fg: oklch(0.925 0.006 250);
        --muted: oklch(0.685 0.01 250);
        --primary: oklch(0.8 0.072 214);
        --fill: oklch(0.19 0.011 250 / 0.9);
        --rim: oklch(1 0 0 / 0.26);
        --rim-low: oklch(1 0 0 / 0.06);
        --spec: oklch(1 0 0 / 0.09);
        --inner: oklch(1 0 0 / 0.08);
        --soft: oklch(1 0 0 / 0.06);
        --line: oklch(0.95 0.005 250 / 0.08);
        --shadow: 0 1px 1px oklch(0 0 0 / 0.25), 0 18px 44px -14px oklch(0 0 0 / 0.65);
      }
      :root.light {
        --fg: oklch(0.24 0.014 250);
        --muted: oklch(0.46 0.012 250);
        --primary: oklch(0.5 0.084 226);
        --fill: oklch(0.975 0.003 240 / 0.93);
        --rim: oklch(1 0 0 / 0.95);
        --rim-low: oklch(0.3 0.014 250 / 0.12);
        --spec: oklch(1 0 0 / 0.6);
        --inner: oklch(1 0 0 / 0.7);
        --soft: oklch(0.3 0.014 250 / 0.06);
        --line: oklch(0.3 0.014 250 / 0.12);
        --shadow: 0 1px 1px oklch(0.3 0.02 250 / 0.1), 0 18px 40px -16px oklch(0.3 0.02 250 / 0.42);
      }
      :root[data-glass="subtle"] { --rim: oklch(1 0 0 / 0.12); --spec: oklch(1 0 0 / 0.03); }
      :root[data-glass="off"] { --rim: var(--line); --rim-low: var(--line); --spec: transparent; --inner: transparent; }

      html, body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font: 400 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      .bar {
        position: relative;
        isolation: isolate;
        box-sizing: border-box;
        margin: 8px;
        border-radius: 26px;
        background: radial-gradient(130% 70% at 16% -14%, var(--spec), transparent 58%), var(--fill);
        box-shadow: inset 0 1px 0 0 var(--inner), inset 0 -1px 1px 0 var(--rim-low), var(--shadow);
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
        transition: opacity 180ms ease, transform 260ms cubic-bezier(0.16, 0.84, 0.24, 1);
      }
      /* Rim of light: brighter top-left, faint bottom-right. */
      .bar::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(145deg, var(--rim), oklch(1 0 0 / 0.04) 30%, transparent 52%, var(--rim-low) 80%, var(--rim) 115%);
        mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
        pointer-events: none;
      }
      body.shown .bar { opacity: 1; transform: none; }
      .row { display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 20px 0 22px; }
      .presence {
        position: relative; width: 10px; height: 10px; flex: none; border-radius: 50%;
        background: var(--primary);
        box-shadow: 0 0 0 4px color-mix(in oklab, var(--primary) 16%, transparent), 0 0 16px color-mix(in oklab, var(--primary) 70%, transparent);
      }
      body.busy .presence { animation: breathe 1.4s ease-in-out infinite; }
      @keyframes breathe { 50% { transform: scale(0.72); opacity: 0.55; } }
      input {
        all: unset; flex: 1; min-width: 0; font-size: 15.5px; letter-spacing: 0.005em; color: var(--fg);
        caret-color: var(--primary);
      }
      input::placeholder { color: color-mix(in oklab, var(--muted) 80%, transparent); }
      .eyebrow {
        font: 400 10px/1 "IBM Plex Mono", ui-monospace, Consolas, monospace;
        letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
      }
      kbd { font: inherit; padding: 2px 5px; border-radius: 5px; background: var(--soft); }
      .answer {
        display: none; margin: 0 14px; padding: 14px 8px 12px; border-top: 1px solid var(--line);
        max-height: 360px; overflow-y: auto; user-select: text;
      }
      body.has-answer .answer { display: block; }
      .answer p { margin: 0 0 9px; }
      .answer p:last-child { margin-bottom: 0; }
      .answer ul { margin: 0 0 9px; padding-left: 18px; }
      .answer li { margin: 2px 0; }
      .answer strong { font-weight: 600; }
      .answer .h { font-family: "Space Grotesk", ui-sans-serif, sans-serif; font-weight: 500; font-size: 15px; letter-spacing: -0.005em; }
      .answer code { font: 12.5px/1.5 "IBM Plex Mono", Consolas, monospace; background: var(--soft); padding: 1px 6px; border-radius: 6px; }
      .answer pre { margin: 0 0 9px; padding: 10px 12px; background: var(--soft); border-radius: 12px; overflow-x: auto; }
      .answer pre code { background: none; padding: 0; }
      .foot { display: none; align-items: center; justify-content: space-between; padding: 2px 22px 14px; }
      body.has-answer .foot { display: flex; }
      .foot button { cursor: pointer; background: none; border: 0; padding: 0; margin: 0; outline: none; }
      .foot button:hover { color: var(--fg); }
      .answer::-webkit-scrollbar { width: 6px; }
      .answer::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--primary) 22%, transparent); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div class="bar" id="bar">
      <div class="row">
        <span class="presence" aria-hidden="true"></span>
        <input id="input" placeholder="Ask VYRSE…" autocomplete="off" spellcheck="false" aria-label="Ask VYRSE" />
        <span class="eyebrow" id="hint"><kbd>↵</kbd> ask · <kbd>esc</kbd></span>
      </div>
      <div class="answer" id="answer" aria-live="polite"></div>
      <div class="foot">
        <span class="eyebrow" id="status"></span>
        <button type="button" class="eyebrow" id="open">open in vyrse ↗</button>
      </div>
    </div>
    <script src="quick.js"></script>
  </body>
</html>
